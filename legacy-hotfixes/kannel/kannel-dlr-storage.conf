# Add to the existing kannel.conf. Needs Kannel built with MySQL support (check: bearerbox -v | grep -i mysql).

# --- add these lines inside the existing "group = core" ---
dlr-storage = mysql
# stop endless resending of the same message (default is unlimited)
sms-resend-retry = 3
sms-resend-freq = 60

# --- add as new groups ---
group = mysql-connection
id = dlr-db
host = localhost
username = kannel_dlr
password = CHANGE_ME
database = CHANGE_ME
max-connections = 4

group = dlr-db
id = dlr-db
table = kannel_dlr
field-smsc = smsc
field-timestamp = ts
field-destination = destination
field-source = source
field-service = service
field-url = url
field-mask = mask
field-status = status
field-boxc-id = boxc
